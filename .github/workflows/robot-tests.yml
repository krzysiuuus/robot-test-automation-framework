name: Robot Framework Tests

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  robot-ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run UI tests
        run: |
          robot \
            -d results/ui \
            --listener allure_robotframework:results/ui/allure \
            --listener RetryFailed:1 \
            -v BROWSER:Chrome \
            -v HEADLESS:True \
            page_object_pattern/tests

      - name: Upload UI Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-results
          path: results/ui/allure/

      - name: Upload UI Robot Framework results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-robot-results
          path: results/ui/


  robot-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: |
          pabot \
            --outputdir results/api \
            --listener allure_robotframework:results/api/allure \
            api_tests/tests

      - name: Upload API Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: results/api/allure/

      - name: Upload API Robot Framework results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-robot-results
          path: results/api/